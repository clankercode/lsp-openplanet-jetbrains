name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --max-workers=2 test buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: openplanet-jetbrains
          path: |
            build/distributions/*.zip
            build/reports/tests/test/
